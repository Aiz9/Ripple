name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create a Release

jobs:
  # (1) Static web export (once); the output is reused by every cross-compiled platform
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # (2) Cross-compile for five platforms (web UI embedded) + zip
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/server/webui/dist
      - name: Build and package with build.sh
        env:
          ANDROIDLAB_TARGET_OS: ${{ matrix.goos }}
          ANDROIDLAB_TARGET_ARCH: ${{ matrix.goarch }}
          ANDROIDLAB_BUILD_VERSION: ${{ github.ref_name }}
          ANDROIDLAB_SKIP_FRONTEND: "1"
          ANDROIDLAB_SKIP_NPM_CI: "1"
          # UPX self-extracting ELF binaries crash under some Linux kernels, virtualization and security policies.
          # Releases use Go linker stripping and zip compression, prioritizing portability.
          ANDROIDLAB_COMPRESS: "0"
          ANDROIDLAB_PACKAGE: "1"
          ANDROIDLAB_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ANDROIDLAB_TARGET_OS}/${ANDROIDLAB_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
  # (3) Collect all zips -> create the GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  # (4) Verify the published release artifacts -> actually run them on both architectures -> push to Docker Hub.
  # To backfill an old version, run the docker-release workflow on its own; it does not republish binaries or move tags.
  docker:
    needs: release
    # Derivative repositories publish binaries without pushing the upstream image.
    # Set DOCKERHUB_IMAGE explicitly to opt in with a repository-owned image name.
    if: github.repository == 'Autumn-27/ARTEX' || vars.DOCKERHUB_IMAGE != ''
    uses: ./.github/workflows/docker-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
